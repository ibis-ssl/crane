// This proto schema is based on https://github.com/SSL-Roots/consai_ros2/tree/main/consai_visualizer_msgs/msg

syntax = "proto3";

package visualizer;

message SvgPrimitive {
  uint32 id = 1;
  float lifetime = 2;
  string svg_text = 3;
}

message SvgPrimitiveArray {
  string layer = 1;
  repeated SvgPrimitive primitives = 2;
}
