// This proto schema is based on https://github.com/SSL-Roots/consai_ros2/tree/main/consai_visualizer_msgs/msg

syntax = "proto3";

package visualizer;

message SvgPrimitiveArray {
  string layer = 1;
  repeated string svg_primitives = 2;
}

message SvgLayerArray {
  repeated SvgPrimitiveArray svg_primitive_arrays = 1;
}
