[pytest]
# pytestの基本設定

# テストファイルのパターン
python_files = *.py

# テスト関数のパターン
python_functions = test_*

# 出力設定
addopts =
    -v
    --tb=short
    --color=yes
    -p no:launch_ros
    -p no:launch_testing
    -p no:launch_pytest

# テストディレクトリ
testpaths = .

# 警告の表示設定
filterwarnings =
    ignore::DeprecationWarning
