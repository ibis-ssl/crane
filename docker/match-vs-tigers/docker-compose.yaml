services:
  grsim:
    image: robocupssl/grsim:latest
    container_name: match_grsim
    network_mode: host
    environment:
      - DISPLAY=:99
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./config/grsim_config.xml:/tmp/grsim_config.xml:ro
      - ./scripts/start_grsim.sh:/tmp/start_grsim.sh:ro
    entrypoint: /bin/sh
    command: ["/tmp/start_grsim.sh"]
    restart: "no"

  ssl-game-controller:
    image: robocupssl/ssl-game-controller:latest
    container_name: match_gc
    network_mode: host
    working_dir: /tmp
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p config
        cp /mounted/ssl-game-controller-match.yaml config/ssl-game-controller.yaml
        cp /mounted/engine.yaml config/engine.yaml
        cp /mounted/state-store-initial.json.stream state-store.json.stream
        exec /app -address localhost:8082 -verbose
    volumes:
      - ./config/ssl-game-controller-match.yaml:/mounted/ssl-game-controller-match.yaml:ro
      - ../config/engine.yaml:/mounted/engine.yaml:ro
      - ./config/state-store-initial.json.stream:/mounted/state-store-initial.json.stream:ro
    tmpfs:
      - /tmp
    restart: "no"

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    container_name: match_autoref
    network_mode: host
    command:
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:11003
      - --trackerAddress
      - 224.5.23.2:11010
    restart: "no"

  crane:
    image: ghcr.io/ibis-ssl/crane:match-local
    container_name: match_crane
    network_mode: host
    command: |
      bash -c "
      source /root/ibis_ws/install/setup.bash &&
      ros2 launch crane_bringup crane.launch.xml sim:=true speak:=false vision_port:=10020 referee_port:=11003 team:=ibis
      "
    tty: true
    stdin_open: true
    restart: "no"

  tigers-blue:
    image: tigersmannheim/sumatra:latest
    container_name: match_tigers_blue
    network_mode: host
    extra_hosts:
      - "match_grsim:127.0.0.1"
    volumes:
      - ./config/simulation_protocol_fixed.xml:/Sumatra/config/moduli/simulation_protocol.xml:ro
    command:
      - --headless
      - --aiBlue
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:11003
      - --matchStats
      - --moduli
      - simulation_protocol
    restart: "no"

  # tigers-yellow:
  #   image: tigersmannheim/sumatra:latest
  #   container_name: match_tigers_yellow
  #   network_mode: host
  #   extra_hosts:
  #     - "match_grsim:127.0.0.1"
  #   volumes:
  #     - ./config/simulation_protocol_fixed.xml:/Sumatra/config/moduli/simulation_protocol.xml:ro
  #   command:
  #     - --headless
  #     - --aiYellow
  #     - --visionAddress
  #     - 224.5.23.2:10020
  #     - --refereeAddress
  #     - 224.5.23.1:11003
  #     - --matchStats
  #     - --moduli
  #     - simulation_protocol
  #   restart: "no"

  match-controller:
    image: python:3.12
    container_name: match_controller
    network_mode: host
    volumes:
      - ./scripts/match_controller_pb.py:/app/match_controller.py:ro
      - ./proto:/app/proto:rw
      - ./results:/app/results:rw
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "
      pip install --timeout=300 --retries=5 -q protobuf grpcio-tools websockets &&
      cd proto &&
      python -m grpc_tools.protoc --python_out=. --proto_path=. api/ssl_gc_api.proto state/*.proto statemachine/*.proto engine/*.proto geom/*.proto &&
      cd .. &&
      python -u match_controller.py
      "
    restart: "no"
