syntax = "proto2";

package grSim;

// ボール置き換えコマンド（センター移動用）
message grSim_BallReplacement {
  optional double x = 1;
  optional double y = 2;
  optional double vx = 3;
  optional double vy = 4;
}

message grSim_Replacement {
  optional grSim_BallReplacement ball = 1;
}

message grSim_Packet {
  optional grSim_Replacement replacement = 2;
}
