version: "3.1"
services:
  grsim:
    image: ghcr.io/ssl-roots/docker_images/grsim:main
    container_name: grsim
    network_mode: host
    command: |
      grSim --headless -platform offscreen
    tty: true
    stdin_open: true
    restart: "no"

  # crane: ローカルモードではDockerではなくホスト上で直接実行する
  # （run_test.shスクリプトから起動される）

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:10003
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host
