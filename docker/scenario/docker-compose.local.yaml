version: "3.1"
services:
  erforce-sim:
    image: ghcr.io/ibis-ssl/framework-simulatorcli:latest
    container_name: erforce-sim
    network_mode: host
    entrypoint: ["tini", "--"]
    command: >
      ./build/bin/simulator-cli
      -g 2020B
      --realism None
      --ibis-use-referee
      --ibis-feedback-team-name ibis
      --ibis-feedback-hz 125
      --ibis-referee-port 11003
    tty: true
    stdin_open: true
    restart: "no"

  # crane: ローカルモードではDockerではなくホスト上で直接実行する
  # （run_test.shスクリプトから起動される）

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:10003
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host
