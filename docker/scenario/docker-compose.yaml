services:
  erforce-sim:
    image: ghcr.io/ibis-ssl/framework-simulatorcli:latest
    container_name: erforce-sim
    network_mode: host
    entrypoint: ["tini", "--"]
    command: >
      ./build/bin/simulator-cli
      -g 2020B
      --realism None
      --ibis-use-referee
      --ibis-feedback-team-name ibis
      --ibis-feedback-hz 125
      --ibis-referee-port 11003
    tty: true
    stdin_open: true
    restart: "no"

  crane:
    image: ghcr.io/ibis-ssl/crane:${CRANE_TAG}
    container_name: crane
    network_mode: host
    command: |
      bash -c "
      source /root/ibis_ws/install/setup.bash &&
      ros2 launch crane_bringup crane.launch.xml sim:=true speak:=false vision_port:=10020 referee_port:=10003 team:=Yellow
      "
    tty: true
    stdin_open: true
    restart: "no"
  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:10003
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host
