version: "3.1"
services:
  grsim:
    image: ghcr.io/ssl-roots/docker_images/grsim:main
    container_name: grsim
    network_mode: host
    command: |
      grSim --headless -platform offscreen
    tty: true
    stdin_open: true
    restart: "no"

  crane:
    image: ghcr.io/ibis-ssl/crane:${CRANE_TAG}
    container_name: crane
    network_mode: host
    command: |
      bash -c "
      source /root/ibis_ws/install/setup.bash &&
      ros2 launch crane_bringup crane.launch.xml sim:=true speak:=false vision_port:=10020 referee_port:=10003 team:=Yellow
      "
    tty: true
    stdin_open: true
    restart: "no"
  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:10003
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host
