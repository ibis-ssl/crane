services:
  ssl-game-controller:
    image: robocupssl/ssl-game-controller:3.11.2
    command:
      - -visionAddress
      - 224.5.23.2:10020
      - -trackerAddress
      - 224.5.23.2:11010 # not yet overridable by autoRefs
      - -publishAddress
      - 224.5.23.1:11111
      - -address
      - :8081
    volumes:
      - ./config:/config:rw
    network_mode: host
    ports:
      - 8081:8081/tcp

  ssl-vision-client:
    image: robocupssl/ssl-vision-client:1.6.0
    command:
      - -address
      - :8082
      - -visionAddress
      - 224.5.23.2:10020
    network_mode: host
    ports:
      - 8082:8082/tcp
  ssl-status-board:
    image: robocupssl/ssl-status-board:2.11.5
    command:
      - -address
      - :8083
      - --refereeAddress
      - 224.5.23.1:11111
    network_mode: host
    ports:
      - 8083:8083/tcp

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - --active # active mode (connect to GC)
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:11111
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host

  simulator:
    image: ghcr.io/ibis-ssl/framework:simulatorcli
    network_mode: host
    environment:
      - GEOMETRY=2023B
      - REALISM=Friendly

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    # image: voicevox/voicevox_engine:nvidia-latest
    ports:
      - 127.0.0.1:50021:50021
