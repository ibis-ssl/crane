services:
  ssl-game-controller:
    image: robocupssl/ssl-game-controller:3.11.2
    command:
      - -visionAddress
      - 224.5.23.2:10020
      - -trackerAddress
      - 224.5.23.2:11010 # not yet overridable by autoRefs
      - -publishAddress
      - 224.5.23.1:11003
      - -address
      - :8081
    volumes:
      - ./config:/config:rw
    network_mode: host
    ports:
      - 8081:8081/tcp

  ssl-vision-client:
    image: ghcr.io/ibis-ssl/ssl-vision-client:develop
    command:
      - -address
      - :8082
    volumes:
      - ./ssl-vision-client-config.json:/config.json:rw
    network_mode: host
    ports:
      - 8082:8082/tcp
  ssl-status-board:
    image: robocupssl/ssl-status-board:2.12.3
    command:
      - -address
      - :8083
      - --refereeAddress
      - 224.5.23.1:11003
    network_mode: host
    ports:
      - 8083:8083/tcp

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - --active # active mode (connect to GC)
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:11003
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host

