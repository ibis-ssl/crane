services:
  grsim:
    image: ghcr.io/ssl-roots/docker_images/grsim:main
    container_name: match_grsim
    networks:
      - match
    command: grSim --headless -platform offscreen
    tty: true
    stdin_open: true
    restart: "no"

  ssl-game-controller:
    image: robocupssl/ssl-game-controller:latest
    container_name: match_gc
    networks:
      - match
    command:
      - -visionAddress
      - 224.5.23.2:10020
      - -publishAddress
      - 224.5.23.1:10003
      - -address
      - :8081
      - -timeAcquisitionMode
      - system
    volumes:
      - ./config/ssl-game-controller-match.yaml:/config/ssl-game-controller.yaml:ro
    restart: "no"
    depends_on:
      - grsim

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    container_name: match_autoref
    networks:
      - match
    command:
      - --headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:10003
      - --trackerAddress
      - 224.5.23.2:11010
    restart: "no"
    depends_on:
      ssl-game-controller:
        condition: service_started

  crane:
    image: ghcr.io/ibis-ssl/crane:${CRANE_TAG:-latest}
    container_name: match_crane
    networks:
      - match
    command: |
      bash -c "
      source /root/ibis_ws/install/setup.bash &&
      ros2 launch crane_bringup crane.launch.xml sim:=true speak:=false vision_port:=10020 referee_port:=10003 team:=Yellow
      "
    tty: true
    stdin_open: true
    restart: "no"
    depends_on:
      ssl-game-controller:
        condition: service_started

  tigers:
    image: tigersmannheim/sumatra:latest
    container_name: match_tigers
    networks:
      - match
    command: --headless
    restart: "no"
    depends_on:
      ssl-game-controller:
        condition: service_started

  match-controller:
    image: python:3.12-slim
    container_name: match_controller
    networks:
      - match
    volumes:
      - ./scripts/match_controller.py:/app/match_controller.py:ro
      - ./proto:/app/proto:ro
      - ./results:/app/results:rw
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "
      pip install -q requests protobuf &&
      python -u match_controller.py
      "
    restart: "no"
    depends_on:
      - ssl-game-controller

networks:
  match:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
