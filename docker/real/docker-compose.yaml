services:
  ssl-game-controller:
    image: robocupssl/ssl-game-controller:3.11.2
    command:
      - -visionAddress
      - 224.5.23.2:10006
      - -trackerAddress
      - 224.5.23.2:10010 # not yet overridable by autoRefs
      - -publishAddress
      - 224.5.23.1:11003
      - -address
      - :8081
    volumes:
      - ./config:/config:rw
    network_mode: host
    ports:
      - 8081:8081/tcp
  ssl-vision-client:
    image: robocupssl/ssl-vision-client:1.6.0
    command:
      - -address
      - :8082
      - -visionAddress
      - 224.5.23.2:10006
    network_mode: host
    ports:
      - 8082:8082/tcp

