<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crane Robot Skills Debugger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .skill-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .skill-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .connected { background-color: #28a745; }
        .disconnected { background-color: #dc3545; }
        .command-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            background-color: #6c757d;
            transition: all 0.2s ease;
        }
        .command-indicator.active {
            background-color: #ffc107;
            box-shadow: 0 0 10px #ffc107;
            animation: pulse 0.2s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .field-visualization {
            width: 100%;
            aspect-ratio: 12 / 9; /* SSL field dimensions: 12m x 9m */
            background: linear-gradient(45deg, #1e5a2f, #2a7a3f);
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
        }
        .field-line {
            position: absolute;
            background-color: white;
            z-index: 1;
        }
        .field-line-horizontal {
            height: 2px;
            width: 100%;
        }
        .field-line-vertical {
            width: 2px;
            height: 100%;
        }
        .field-center-circle {
            position: absolute;
            border: 2px solid white;
            border-radius: 50%;
            background: transparent;
            z-index: 1;
        }
        .field-goal-area {
            position: absolute;
            border: 2px solid white;
            background: transparent;
            z-index: 1;
        }
        .field-penalty-area {
            position: absolute;
            border: 2px solid white;
            background: transparent;
            z-index: 1;
        }
        .robot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #007bff;
            border-radius: 50%;
            border: 2px solid #fff;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffc107;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        .log-container {
            height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        .log-info { color: #6c757d; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-error { color: #dc3545; }

        .robot-status-card {
            transition: all 0.2s ease;
        }
        .robot-status-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-robot"></i> Crane Robot Skills Debugger
            </span>
            <div class="d-flex align-items-center">
                <span class="status-indicator" id="connectionStatus"></span>
                <span id="connectionText" class="text-light">Disconnected</span>
                <span class="ms-3">
                    <span class="command-indicator" id="commandIndicator"></span>
                    <span id="commandText" class="text-light">Waiting...</span>
                </span>
                <a href="/" class="btn btn-outline-light btn-sm ms-3">
                    <i class="fas fa-home me-1"></i>ポータル
                </a>
                <div class="dropdown ms-2">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="toolsDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-tools me-1"></i>他のツール
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="toolsDropdown">
                        <li><a class="dropdown-item" href="/svg_viewer.html"><i class="fas fa-layer-group me-2"></i>SVG可視化ツール</a></li>
                        <li><a class="dropdown-item" href="/standalone.html"><i class="fas fa-terminal me-2"></i>スタンドアローン</a></li>
                        <li><a class="dropdown-item" href="/annotation/index.html"><i class="fas fa-sticky-note me-2"></i>アノテーション</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>


    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Center Panel: Field Visualization -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-futbol"></i> Field Visualization</h5>
                    </div>
                    <div class="card-body">
                        <div class="field-visualization" id="fieldViz">
                            <!-- Field elements will be drawn here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Status and Logs -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-info-circle"></i> Robot Status</h5>
                    </div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="robotStatus">
                            <p class="text-muted">No robot data available</p>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="fas fa-terminal"></i> Execution Log</h5>
                        <button class="btn btn-sm btn-outline-secondary" id="clearLogBtn">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="log-container" id="logContainer">
                            <!-- Log entries will appear here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Robot Detail Modal -->
    <div class="modal fade" id="robotDetailModal" tabindex="-1" aria-labelledby="robotDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="robotDetailModalLabel">Robot Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="robotDetailContent">
                        <!-- Robot details will be populated here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="ignored"></script>
</body>
</html>
