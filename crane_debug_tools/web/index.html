<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crane Robot Skills Debugger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .skill-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .skill-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .connected { background-color: #28a745; }
        .disconnected { background-color: #dc3545; }
        .command-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            background-color: #6c757d;
            transition: all 0.2s ease;
        }
        .command-indicator.active {
            background-color: #ffc107;
            box-shadow: 0 0 10px #ffc107;
            animation: pulse 0.2s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .field-visualization {
            width: 100%;
            height: 400px;
            background: linear-gradient(45deg, #1e3a2f, #2a5a3f);
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
        }
        .robot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #007bff;
            border-radius: 50%;
            border: 2px solid #fff;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffc107;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        .log-container {
            height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        .log-info { color: #6c757d; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-error { color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-robot"></i> Crane Robot Skills Debugger
            </span>
            <div class="d-flex align-items-center">
                <span class="status-indicator" id="connectionStatus"></span>
                <span id="connectionText">Disconnected</span>
                <span class="ms-3">
                    <span class="command-indicator" id="commandIndicator"></span>
                    <span id="commandText">Waiting...</span>
                </span>
            </div>
        </div>
    </nav>
    
    <!-- スタンドアローン版への案内 -->
    <div class="container-fluid mt-2">
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            <i class="fas fa-info-circle"></i>
            <strong>推奨:</strong> より良いエクスペリエンスのために
            <a href="standalone.html" class="alert-link">スタンドアローン版</a>
            をご利用ください。WebSocket接続不要で全機能が利用できます。
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Left Panel: Skill Selection -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-cogs"></i> Available Skills</h5>
                    </div>
                    <div class="card-body" style="max-height: 500px; overflow-y: auto;">
                        <div id="skillsList" class="d-grid gap-2">
                            <!-- Skills will be populated here -->
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-sliders-h"></i> Execution Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="robotId" class="form-label">Robot ID</label>
                            <select class="form-select" id="robotId">
                                <!-- Options 0-15 will be populated -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="selectedSkill" class="form-label">Selected Skill</label>
                            <input type="text" class="form-control" id="selectedSkill" readonly>
                        </div>
                        <button class="btn btn-primary w-100" id="executeBtn" disabled>
                            <i class="fas fa-play"></i> Execute Skill
                        </button>
                    </div>
                </div>
            </div>

            <!-- Center Panel: Field Visualization -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-futbol"></i> Field Visualization</h5>
                    </div>
                    <div class="card-body">
                        <div class="field-visualization" id="fieldViz">
                            <!-- Field elements will be drawn here -->
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-code"></i> Skill Parameters</h5>
                    </div>
                    <div class="card-body">
                        <div id="parametersForm">
                            <p class="text-muted">Select a skill to configure parameters</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Status and Logs -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-info-circle"></i> Robot Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="robotStatus">
                            <p class="text-muted">No robot data available</p>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="fas fa-terminal"></i> Execution Log</h5>
                        <button class="btn btn-sm btn-outline-secondary" id="clearLogBtn">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="log-container" id="logContainer">
                            <!-- Log entries will appear here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
