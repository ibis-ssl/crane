# キッカーと物理モデル統合設定ファイル
# crane_physics/KickerModel と crane_physics/BallPhysicsModel の統合設定

# ===== キッカーモデル設定 =====
kicker_model:
  # ストレートキック設定（キック力 <-> ボール初速度）
  # キック力: 0.0-1.0 の範囲で指定
  # ボール初速度: m/s 単位
  # ER-Force シミュレータ実測。旧値（grSim 想定）は [0.0, 2.0, 4.0, 6.0] で、
  # 実際には指令値の約 1.36 倍の初速が出ていた。計画が 2.2 m/s を指令すると
  # 実測 3.0 m/s となり、ボールが受領点を 3〜5m 越えて場外に出ていた。
  # 3 回分の走行から crane の EKF 推定で 6 サンプルを取り、比は 1.31〜1.38
  # （中央値 1.36）と安定していたので、全点を一律 1.36 倍する。
  # 実測できたのはキック力 0.285 付近（パス初速帯）のみで、高出力側は
  # シュート（指令 6.0 m/s）の vision 実測 7.6〜8.1 m/s から比 1.27〜1.35 と
  # 概ね整合することを確認したにとどまる。高出力側を使う場面が増えたら測り直すこと。
  straight_kick_powers: [0.0, 0.25, 0.6, 0.9]
  straight_kick_speeds: [0.0, 2.72, 5.44, 8.16]

  # チップキック設定（キック力 <-> 飛行距離）
  # キック力: 0.0-1.0 の範囲で指定
  # 飛行距離: m 単位
  # 未較正。通常プレーのパスは直進固定（PassPlan.is_chip は false）なので
  # 今回の実測対象に含めていない。チップを使う経路を足すときに測ること。
  chip_kick_powers: [0.0, 0.5, 0.75, 1.0]
  chip_kick_distances: [0.0, 0.3, 1.0, 2.5]

# ===== ボール物理モデル設定 =====
ball_physics_model:
  # 転がり時の減速度 (m/s²)
  # ER-Force シミュレータ実測値。erforce_ball_physics.yaml と揃えること
  # （測り方の詳細はそちらのコメント）。旧 grSim 想定値は 0.7。
  deceleration: 0.36

  # 重力加速度 (m/s²)
  # 飛行中のボールに作用する重力
  gravity: -9.81

  # 空気抵抗係数
  # 飛行中のボールに作用する空気抵抗（現在は無視）
  air_resistance: 0.0

  # 飛行判定の高度閾値 (m)
  # この高度を超えるとボールが飛行状態と判定される
  height_threshold: 0.05

  # 移動判定の速度閾値 (m/s)
  # この速度を超えるとボールが移動状態と判定される
  speed_threshold: 0.1

  # 停止判定の速度閾値 (m/s)
  # この速度を下回るとボールが停止状態と判定される
  stop_threshold: 0.05

# ===== 使用方法 =====
# このファイルは以下のように使用されます：
#
# 1. KickerModel:
#    - キック力からボール初速度の予測
#    - ボール初速度からキック力の計算
#    - 目標停止距離からキック力の計算
#
# 2. BallPhysicsModel:
#    - ボールの軌道予測
#    - 状態遷移の判定
#    - EKFによる状態推定
#
# 3. 統合機能:
#    - KickerModelがBallPhysicsModelを使用して停止距離を計算
#    - RobotCommandWrapperで直感的なキック指定が可能
#
# ===== 設定値の説明 =====
#
# ER-Force シミュレータ実測値:
# - ストレートキック: キック力0.9で約8.2m/sの初速度
# - チップキック: 未較正（grSim 想定値のまま）
# - ボール減速: 0.36m/s²
#
# 実機環境では以下の調整が必要です：
# - キック力と初速度/距離の対応関係
# - ボールの減速度（フィールド面による）
# - 飛行時の空気抵抗（高速キック時）
