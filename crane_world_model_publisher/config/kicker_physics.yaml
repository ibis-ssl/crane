# キッカーと物理モデル統合設定ファイル
# crane_physics/KickerModel と crane_physics/BallPhysicsModel の統合設定

# ===== キッカーモデル設定 =====
kicker_model:
  # ストレートキック設定（キック力 <-> ボール初速度）
  # キック力: 0.0-1.0 の範囲で指定
  # ボール初速度: m/s 単位
  straight_kick_powers:  [0.0, 0.25, 0.6, 0.9]
  straight_kick_speeds:  [0.0, 2.0, 4.0, 6.0]

  # チップキック設定（キック力 <-> 飛行距離）
  # キック力: 0.0-1.0 の範囲で指定
  # 飛行距離: m 単位
  chip_kick_powers:      [0.0, 0.5, 0.75, 1.0]
  chip_kick_distances:   [0.0, 0.3, 1.0, 2.5]

# ===== ボール物理モデル設定 =====
ball_physics_model:
  # 転がり時の減速度 (m/s²)
  # ボールが地面を転がる時の摩擦による減速
  deceleration: 0.7

  # 重力加速度 (m/s²)
  # 飛行中のボールに作用する重力
  gravity: -9.81

  # 空気抵抗係数
  # 飛行中のボールに作用する空気抵抗（現在は無視）
  air_resistance: 0.0

  # 飛行判定の高度閾値 (m)
  # この高度を超えるとボールが飛行状態と判定される
  height_threshold: 0.05

  # 移動判定の速度閾値 (m/s)
  # この速度を超えるとボールが移動状態と判定される
  speed_threshold: 0.1

  # 停止判定の速度閾値 (m/s)
  # この速度を下回るとボールが停止状態と判定される
  stop_threshold: 0.05

# ===== 使用方法 =====
# このファイルは以下のように使用されます：
#
# 1. KickerModel:
#    - キック力からボール初速度の予測
#    - ボール初速度からキック力の計算
#    - 目標停止距離からキック力の計算
#
# 2. BallPhysicsModel:
#    - ボールの軌道予測
#    - 状態遷移の判定
#    - EKFによる状態推定
#
# 3. 統合機能:
#    - KickerModelがBallPhysicsModelを使用して停止距離を計算
#    - RobotCommandWrapperで直感的なキック指定が可能
#
# ===== 設定値の説明 =====
#
# grSim環境用デフォルト値:
# - ストレートキック: 最大6m/sの初速度（キック力0.9時）
# - チップキック: 最大2.5mの飛行距離（キック力1.0時）
# - ボール減速: 0.7m/s²（標準的な人工芝摩擦）
#
# 実機環境では以下の調整が必要な場合があります：
# - キック力と初速度/距離の対応関係
# - ボールの減速度（フィールド面による）
# - 飛行時の空気抵抗（高速キック時）
