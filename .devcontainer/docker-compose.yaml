networks:
  ssl-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"

services:
  crane:
    build:
      # ワークスペース全体をコンテキストに設定
      context: ../../..
      dockerfile: src/crane/.devcontainer/Dockerfile
      args:
        # GitHub Codespaces では軽量版、ローカルでは完全版を使用
        BASE_IMAGE: ${BASE_IMAGE:-osrf/ros:jazzy-desktop-full}
    volumes:
      # ワークスペース全体をマウント（ビルド成果物も共有）
      - ../../../:/home/developer/ibis_ws
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - CYCLONE_DDS_ENABLED_TRANSPORTS=udp
      - DISPLAY=${DISPLAY:-:0}
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    working_dir: /home/developer/ibis_ws

  grsim:
    image: robocupssl/grsim:latest
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    privileged: true

  ssl-game-controller:
    image: robocupssl/ssl-game-controller:3.11.2
    command:
      - -visionAddress
      - 224.5.23.2:10020
      - -trackerAddress
      - 224.5.23.2:11010
      - -publishAddress
      - 224.5.23.1:11111
      - -address
      - :8081
    network_mode: host

  ssl-vision-client:
    image: robocupssl/ssl-vision-client:1.6.0
    command:
      - -address
      - :8082
      - -visionAddress
      - 224.5.23.2:10020
    network_mode: host

  ssl-status-board:
    image: robocupssl/ssl-status-board:latest
    command:
      - -address
      - :8083
    network_mode: host

  autoref-tigers:
    image: tigersmannheim/auto-referee:1.2.0
    command:
      - -a # active mode (connect to GC)
      - -hl # headless
      - --visionAddress
      - 224.5.23.2:10020
      - --refereeAddress
      - 224.5.23.1:11003
      - --trackerAddress
      - 224.5.23.2:11010
    network_mode: host
