<!DOCTYPE html>
<!-- deprecated: remove after 2027-03
     テレメトリは Viewer のフォーカスサイドバー（?robot=<id>&tab=telemetry）へ統合した。
     ブックマークと crane-nav の古いリンクを救うためのスタブ。
     web_server/app.py は StaticFiles を "/" にマウントしており、Starlette は
     登録順にマッチするので Python 側でリダイレクトを足すにはマウントより前に
     登録が要る。meta refresh なら Python 無改修・bind mount で即反映できる。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Telemetry → Viewer へ移動しました</title>
  <script>
    // 旧 ?id=N を新しい ?robot=N&tab=telemetry へ写す
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const q = new URLSearchParams({ tab: 'telemetry' });
      if (id !== null) q.set('robot', id);
      location.replace('/?' + q.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/?tab=telemetry">
</head>
<body>
  <p>テレメトリは Viewer に統合されました。<a href="/?tab=telemetry">Viewer を開く</a></p>
</body>
</html>
