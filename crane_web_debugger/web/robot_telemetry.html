<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Telemetry - Crane</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d1117;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .navbar {
      flex-shrink: 0;
      background: #16213e !important;
      border-bottom: 1px solid #0f3460;
    }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #dc3545;
      display: inline-block;
      transition: background 0.3s;
    }
    #status-dot.connected { background: #28a745; }

    #header-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    #header-bar .robot-id-badge {
      font-size: 1.1rem;
      font-weight: 700;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 6px;
      padding: 2px 10px;
      color: #7ec8e3;
    }

    #header-bar .info-chip {
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      color: #ccc;
    }

    #scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #scroll-area::-webkit-scrollbar { width: 6px; }
    #scroll-area::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

    .chart-card {
      background: #16213e;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .chart-card h6 {
      font-size: 0.75rem;
      color: #7ec8e3;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .chart-wrapper {
      position: relative;
      height: 180px;
    }

    .correction-bar-section {
      background: #16213e;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .correction-bar-section h6 {
      font-size: 0.75rem;
      color: #7ec8e3;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .correction-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.75rem;
    }

    .correction-source {
      width: 100px;
      flex-shrink: 0;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .correction-bar-bg {
      flex: 1;
      height: 8px;
      background: #0f3460;
      border-radius: 4px;
      overflow: hidden;
    }

    .correction-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.2s;
    }

    .correction-value {
      width: 50px;
      text-align: right;
      color: #ccc;
    }

    .data-table {
      background: #16213e;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .data-table h6 {
      font-size: 0.75rem;
      color: #7ec8e3;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .data-table table {
      width: 100%;
      font-size: 0.75rem;
      border-collapse: collapse;
    }

    .data-table th {
      color: #6c757d;
      font-weight: 600;
      padding: 3px 6px;
      border-bottom: 1px solid #1a4a7a;
      text-align: center;
    }

    .data-table td {
      padding: 3px 6px;
      text-align: center;
      color: #e0e0e0;
      border-bottom: 1px solid #0f3460;
      font-variant-numeric: tabular-nums;
    }

    .data-table tr:last-child td { border-bottom: none; }

    .buffer-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #0d1117;
      border-top: 1px solid #0f3460;
      flex-shrink: 0;
      font-size: 0.75rem;
    }

    .buffer-control input[type=range] {
      flex: 1;
      accent-color: #2d7dd2;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark py-1">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-3">
        <a href="/viewer.html" class="btn btn-sm btn-outline-secondary py-0">
          <i class="fas fa-arrow-left me-1"></i>ビューアに戻る
        </a>
        <span class="navbar-brand mb-0 h6">
          <i class="fas fa-chart-line me-1 text-info"></i>Robot Telemetry
        </span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label for="robot-selector" class="text-muted" style="font-size:0.8rem; margin:0;">Robot ID:</label>
        <select id="robot-selector" class="form-select form-select-sm" style="width:80px; background:#0f3460; color:#e0e0e0; border-color:#1a4a7a;">
        </select>
        <span id="status-dot"></span>
        <span id="status-label" style="font-size:0.8rem;">未接続</span>
      </div>
    </div>
  </nav>

  <!-- Header info bar -->
  <div id="header-bar">
    <span class="robot-id-badge">ID: <span id="current-robot-id">--</span></span>
    <span class="info-chip" id="header-planner">プランナー: --</span>
    <span class="info-chip" id="header-mode">モード: --</span>
    <span class="info-chip" id="header-pos">位置: (---, ---)</span>
    <span class="info-chip" id="header-vel">速度: (---, ---)</span>
  </div>

  <!-- Scroll area -->
  <div id="scroll-area">
    <div class="row g-2">
      <!-- 位置 X/Y チャート -->
      <div class="col-md-6">
        <div class="chart-card">
          <h6><i class="fas fa-map-marker-alt me-1"></i>位置 X / Y</h6>
          <div class="chart-wrapper">
            <canvas id="chart-position"></canvas>
          </div>
        </div>
      </div>

      <!-- 速度 Vx/Vy チャート -->
      <div class="col-md-6">
        <div class="chart-card">
          <h6><i class="fas fa-tachometer-alt me-1"></i>速度 Vx / Vy</h6>
          <div class="chart-wrapper">
            <canvas id="chart-velocity"></canvas>
          </div>
        </div>
      </div>

      <!-- 角度 theta チャート -->
      <div class="col-md-6">
        <div class="chart-card">
          <h6><i class="fas fa-compass me-1"></i>角度 θ</h6>
          <div class="chart-wrapper">
            <canvas id="chart-theta"></canvas>
          </div>
        </div>
      </div>

      <!-- 予実誤差チャート -->
      <div class="col-md-6">
        <div class="chart-card">
          <h6><i class="fas fa-exclamation-triangle me-1"></i>予実誤差</h6>
          <div class="chart-wrapper">
            <canvas id="chart-error"></canvas>
          </div>
        </div>
      </div>

      <!-- 速度修正バー -->
      <div class="col-12">
        <div class="correction-bar-section">
          <h6><i class="fas fa-sliders-h me-1"></i>速度修正 (VelocityCorrection)</h6>
          <div id="correction-bars">
            <div style="color:#666; font-size:0.75rem;">データなし</div>
          </div>
        </div>
      </div>

      <!-- 数値テーブル -->
      <div class="col-12">
        <div class="data-table">
          <h6><i class="fas fa-table me-1"></i>リアルタイム数値</h6>
          <table>
            <thead>
              <tr>
                <th></th>
                <th>推定位置 (x,y,θ)</th>
                <th>Vision位置 (x,y,θ)</th>
                <th>目標位置 (x,y)</th>
                <th>推定速度 (vx,vy)</th>
                <th>目標速度 (vx,vy)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="color:#6c757d; font-weight:600;">値</td>
                <td id="tbl-est-pos">--</td>
                <td id="tbl-vis-pos">--</td>
                <td id="tbl-tgt-pos">--</td>
                <td id="tbl-est-vel">--</td>
                <td id="tbl-tgt-vel">--</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Buffer size control -->
  <div class="buffer-control">
    <span class="text-muted">バッファ:</span>
    <input type="range" id="buffer-size-slider" min="100" max="600" value="300" step="100">
    <span id="buffer-size-label">300点 (30秒)</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="robot_telemetry.js"></script>
</body>
</html>
