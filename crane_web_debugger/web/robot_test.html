<!DOCTYPE html>
<!-- deprecated: remove after 2027-03
     ロボットテストは Viewer のフォーカスサイドバー（?robot=<id>&tab=test）へ統合した。
     旧「ロボット移動モード」はテストタブの「指令経路: 直接」として同居している。
     ブックマークと古いリンクを救うためのスタブ。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Robot Test → Viewer へ移動しました</title>
  <script>
    // 旧 ?id=N を新しい ?robot=N&tab=test へ写す
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const q = new URLSearchParams({ tab: 'test' });
      if (id !== null) q.set('robot', id);
      location.replace('/?' + q.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/?tab=test">
</head>
<body>
  <p>ロボットテストは Viewer に統合されました。<a href="/?tab=test">Viewer を開く</a></p>
</body>
</html>
