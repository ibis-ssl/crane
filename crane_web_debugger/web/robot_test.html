<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Test - Crane</title>
  <link rel="stylesheet" href="/fonts/noto-sans-jp.css">
  <link rel="stylesheet" href="/fonts/roboto.css">
  <link rel="stylesheet" href="/fonts/material-symbols-outlined.css">
  <link rel="stylesheet" href="m3e-theme.css">
  <link rel="stylesheet" href="/shared/nav/crane-nav.css">
  <script type="module" src="/shared/nav/crane-nav.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
      gap: 8px;
    }

    #top-row {
      display: flex;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    #field-container {
      flex: 1;
      min-width: 0;
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-md);
      border: 1px solid var(--md-sys-color-outline-variant);
      position: relative;
      overflow: hidden;
    }
    #field-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #controls-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-md);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: var(--md-sys-spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--md-sys-spacing-md);
      overflow-y: auto;
    }

    .controls-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--md-sys-color-primary);
      margin-bottom: 4px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .control-row label {
      width: 80px;
      flex-shrink: 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    .control-row input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: var(--md-sys-color-primary);
    }
    .control-row .value-display {
      width: 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--md-sys-color-on-surface);
    }
    .control-row input[type="number"] {
      width: 70px;
      padding: 4px 6px;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-sm);
      color: var(--md-sys-color-on-surface);
      font-size: 0.8rem;
    }

    .selected-robot-info {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-sys-shape-sm);
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    .selected-robot-info .robot-id-large {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      line-height: 1;
    }
    .selected-robot-info .label {
      font-size: 0.7rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    .status-pill.active {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    #mode-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
    }
    #mode-status.active {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    #chart-row {
      height: 180px;
      flex-shrink: 0;
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-md);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
    }
    #chart-row .chart-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 4px;
    }
    #chart-speed {
      flex: 1;
      min-height: 0;
    }

    .hint-text {
      font-size: 0.7rem;
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
      padding: 4px;
    }

    .target-marker-label {
      font-size: 0.7rem;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>
  <crane-nav active="robot-test"></crane-nav>
  <script>
    (function () {
      const statusEl = document.getElementById('crane-nav-status');
      if (statusEl) {
        statusEl.innerHTML =
          '<div id="mode-status">INACTIVE</div>' +
          '<span class="m3-connection-dot" id="status-dot"></span>' +
          '<span style="font-size:0.75rem;color:var(--md-sys-color-on-surface-variant);" id="status-label">connecting...</span>';
      }
    })();
  </script>

  <!-- Offline banner -->
  <div class="m3-offline-banner" id="offline-banner">
    <span class="material-symbols-outlined">wifi_off</span>
    crane WebSocket未接続 (port 8091) — craneが起動すると自動で再接続します
  </div>

  <!-- Main content -->
  <div id="main-content">
    <div id="top-row">
      <!-- Field canvas -->
      <div id="field-container">
        <canvas id="field-canvas"></canvas>
        <div class="hint-text" style="position:absolute;bottom:6px;left:0;right:0;pointer-events:none;">
          クリック: ロボット選択 / 目的地設定 &nbsp;|&nbsp; ホイール: ズーム &nbsp;|&nbsp; ドラッグ: パン
        </div>
      </div>

      <!-- Controls panel -->
      <div id="controls-panel">
        <!-- Mode control -->
        <div>
          <div class="controls-section-title">Mode</div>
          <div class="btn-group">
            <button id="btn-activate" class="m3-btn m3-btn--filled m3-btn--sm" style="flex:1">
              <span class="material-symbols-outlined icon-sm">play_arrow</span>
              Activate
            </button>
            <button id="btn-deactivate" class="m3-btn m3-btn--tonal m3-btn--sm" style="flex:1">
              <span class="material-symbols-outlined icon-sm">stop</span>
              Deactivate
            </button>
          </div>
        </div>

        <!-- Selected robot -->
        <div>
          <div class="controls-section-title">Selected Robot</div>
          <div class="selected-robot-info">
            <div class="label">Robot ID</div>
            <div class="robot-id-large" id="selected-robot-id">--</div>
            <div style="margin-top:6px;font-size:0.75rem;color:var(--md-sys-color-on-surface-variant);">
              Target: <span id="target-pos-display">--</span>
            </div>
          </div>
        </div>

        <!-- Speed limits -->
        <div>
          <div class="controls-section-title">Speed Limits</div>
          <div class="control-row">
            <label>Max Vel</label>
            <input type="range" id="slider-max-vel" min="0" max="4" step="0.1" value="2.0">
            <span class="value-display" id="display-max-vel">2.0</span>
            <span style="font-size:0.7rem;color:var(--md-sys-color-on-surface-variant);">m/s</span>
          </div>
          <div class="control-row" style="margin-top:6px">
            <label>Max Acc</label>
            <input type="range" id="slider-max-acc" min="0" max="5" step="0.1" value="2.5">
            <span class="value-display" id="display-max-acc">2.5</span>
            <span style="font-size:0.7rem;color:var(--md-sys-color-on-surface-variant);">m/s²</span>
          </div>
        </div>

        <!-- Target theta -->
        <div>
          <div class="controls-section-title">Target Angle</div>
          <div class="control-row">
            <label>Theta</label>
            <input type="number" id="input-theta" value="0" step="5" min="-180" max="180">
            <span style="font-size:0.7rem;color:var(--md-sys-color-on-surface-variant);">deg</span>
          </div>
        </div>

        <!-- Current velocity readout -->
        <div>
          <div class="controls-section-title">Current Speed</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:0.75rem;">
            <div>
              <div style="color:var(--md-sys-color-on-surface-variant);font-size:0.65rem;">Est. Speed</div>
              <div id="readout-est-speed" style="font-variant-numeric:tabular-nums;font-weight:600;">-- m/s</div>
            </div>
            <div>
              <div style="color:var(--md-sys-color-on-surface-variant);font-size:0.65rem;">Odom Speed</div>
              <div id="readout-odom-speed" style="font-variant-numeric:tabular-nums;font-weight:600;">-- m/s</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Speed chart -->
    <div id="chart-row">
      <div class="chart-title">Speed (m/s) — Cmd / Est / Odom / Mouse</div>
      <canvas id="chart-speed"></canvas>
    </div>
  </div>

  <script src="/assets/chart.umd.min.js"></script>
  <script src="robot_test.js"></script>
</body>
</html>
