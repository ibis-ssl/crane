  wing_formation:
    description: wing/キーパーなし
    sessions:
      - name: wing_formation
        max_robots: 20
  HALF_FIELD_PRACTICE:
    description: 半面練習モード（FW逆方向攻撃・キック禁止・移動制限あり・レフェリー信号基準）
    # *_fixed セッションは派生クラス側で setUseFixedRobots(true) を立てており、
    # 実際に固定するロボットIDはこの fixed_robots: [...] で指定する。
    # （未指定だと WARN が出て動的割当に fallback する）
    # attacker_heat_rotation は派生クラス側で setUseCandidateRobots(true) を立てており、
    # candidate_robots: [...] で候補プールを与えると、モーター温度の低い1台を
    # その候補内から自動選択する（allocator の割当アルゴリズムには影響しない）。
    practice_mode:
      enabled: true
      kick_prohibition: true
      reverse_attack: true
      use_normal_speed: true
      # スキル名は SkillInterface の command->name と完全一致比較される。
      # 合成スキル(Attacker → 内部 KickOld/GoalKick 等)も親のスキル名で判定される。
      kick_allowed_skills:
        - goalie
        - attacker
        - defender
    sessions:
      - name: goalie_fixed
        max_robots: 1
        fixed_robots: [0]
      - name: attacker_heat_rotation
        max_robots: 1
        # 候補プール。基本は同一ロボットを使い続け、最大モータ温度が
        # rotation_trigger_celsius を超えた瞬間に候補内で最も冷えたロボットへ切替える。
        candidate_robots: [1, 5, 9]
        # しきい値（℃）。省略時は 60℃。
        # params:
        #   rotation_trigger_celsius: 65.0
      - name: defender_fixed
        max_robots: 3
        fixed_robots: [2, 3, 4]
        params:
          reduced_robots: 1
      - name: pass_receive_fixed
        max_robots: 1
        fixed_robots: [5]
      - name: sub_attacker_fixed
        max_robots: 1
        fixed_robots: [6]
      - name: marker_fixed
        max_robots: 2
        fixed_robots: [7, 8]
      - name: forward
        max_robots: 20
