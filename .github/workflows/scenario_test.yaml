name: scenario test

on:
  workflow_dispatch:
  pull_request:
  merge_group:

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read
  packages: write

jobs:
  create_scenario_test_image:
    name: build image for scenario test
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [jazzy]
    steps:
      - name: free disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache@v4
        with:
          path: cache-mount
          key: scenario-ccache-v2-${{ runner.os }}-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            scenario-ccache-v2-${{ runner.os }}-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}-
            docker-ccache-v2-${{ runner.os }}-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}-
            scenario-ccache-v2-${{ runner.os }}-
            docker-ccache-v2-${{ runner.os }}-

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          cache-map: |
            {
              "crane-ccache": "/root/.ccache"
            }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      - name: Build and push image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scenario
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository }}:scenario-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:deps-jazzy
            type=registry,ref=ghcr.io/${{ github.repository }}:scenario-develop
            type=gha,scope=scenario-develop
            type=gha,scope=scenario
          cache-to: type=gha,mode=max,scope=scenario-develop

      - name: Build image for fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scenario
          pull: true
          tags: ghcr.io/${{ github.repository }}:scenario-${{ github.sha }}
          outputs: type=docker,dest=/tmp/scenario-image.tar
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:deps-jazzy
            type=registry,ref=ghcr.io/${{ github.repository }}:scenario-develop
            type=gha,scope=scenario-develop
            type=gha,scope=scenario

      - name: Upload fork image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v5
        with:
          name: scenario-image-${{ github.sha }}
          path: /tmp/scenario-image.tar
          retention-days: 1

  setup_scenario_test_library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('scenario_test/**/*.py') }}-robocup-scenario
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: Install robocup_scenario_test library
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install --upgrade pip
          sudo apt update
          sudo apt install -y protobuf-compiler
          # 本家は更新が止まっているため ibis-ssl のフォークを使う。commit SHA 固定の理由は
          # scripts/scenario_test/setup_env.sh のコメントを参照。
          pip install -v git+https://github.com/ibis-ssl/robocup_scenario_test@aa3a6ab6b8608224e107f51003be0503fc47d41f
          pip install pytest

  scenario_test:
    needs: [create_scenario_test_image, setup_scenario_test_library]
    strategy:
      fail-fast: false
      matrix:
        env:
          # - TEST: STOP_AVOID_BALL
          - TEST: STOP_ROBOT_SPEED
          - TEST: emit_from_penalty_01
          - TEST: BALL_PLACEMENT_NEAR_WALL
          - TEST: PENALTY_AREA_BYPASS_STABILITY

    runs-on: ubuntu-latest
    steps:
      - name: free disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('scenario_test/**/*.py') }}-robocup-scenario
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: Setup virtual environment
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install --upgrade pip
          sudo apt update
          sudo apt install -y protobuf-compiler
          # 本家は更新が止まっているため ibis-ssl のフォークを使う。commit SHA 固定の理由は
          # scripts/scenario_test/setup_env.sh のコメントを参照。
          pip install -v git+https://github.com/ibis-ssl/robocup_scenario_test@aa3a6ab6b8608224e107f51003be0503fc47d41f
          pip install pytest

      - name: Download fork image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/download-artifact@v5
        with:
          name: scenario-image-${{ github.sha }}
          path: /tmp

      - name: Load fork image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: docker load --input /tmp/scenario-image.tar

      - name: Start Docker Compose services
        run: |
          for i in 1 2 3; do
            docker compose -f docker/scenario/docker-compose.yaml up -d && break
            echo "Attempt $i failed, retrying in 10s..."
            docker compose -f docker/scenario/docker-compose.yaml down 2>/dev/null || true
            sleep 10
          done
        env:
          CRANE_TAG: scenario-${{ github.sha }}
          USE_LOCAL: '0'

      - name: Wait for crane to start
        timeout-minutes: 5
        run: |
          sleep 5

      # cm4-sim は位置制御ループそのもの。落ちているとテストは無意味に失敗し、
      # 原因が crane 側にあるように見えてしまうのでここで切り分ける。
      - name: Check simulator stack is up
        run: |
          docker compose -f docker/scenario/docker-compose.yaml ps
          for svc in erforce-sim cm4-sim crane; do
            state="$(docker inspect -f '{{.State.Running}}' "$svc" 2>/dev/null || echo missing)"
            if [ "$state" != "true" ]; then
              echo "::error::サービス $svc が起動していません (state=$state)"
              docker compose -f docker/scenario/docker-compose.yaml logs "$svc" || true
              exit 1
            fi
          done

      - name: Download logger
        run: |
          curl -L https://github.com/RoboCup-SSL/ssl-go-tools/releases/download/v1.5.2/ssl-log-recorder_v1.5.2_linux_amd64 -o ssl-log-recorder
          chmod +x ssl-log-recorder

      - name: Run pytest
        id: pytest
        run: |
          source env/bin/activate
          pytest scenario_test/${{ matrix.env.TEST }}.py --vision_port=10020 --logging --log_recorder=./ssl-log-recorder
          echo "LOG_EXISTS=$(find . -maxdepth 1 -name '*.log.gz' -print -quit)" >> "$GITHUB_ENV"

      - name: Get and print logs
        if: always()
        run: docker compose -f docker/scenario/docker-compose.yaml logs

      - name: Clean up Docker Compose services
        if: always()
        run: docker compose -f docker/scenario/docker-compose.yaml down

      - name: setup ssl-log-video
        if: ${{ failure() || contains(github.event.pull_request.labels.*.name, 'シナリオテスト動画出力') }}
        run: |
          export PATH=$PATH:/usr/local/go/bin && \
          git clone https://github.com/ibis-ssl/ssl-go-tools.git -b video && \
          cd ssl-go-tools/cmd/ssl-log-video && \
          go mod tidy && \
          go build -o ssl-log-video ssl-log-video.go && \
          chmod +x ssl-log-video

      - name: make log video
        if: ${{ failure() || contains(github.event.pull_request.labels.*.name, 'シナリオテスト動画出力') }}
        run: |
          export PATH=$PATH:/usr/local/go/bin
          sudo apt update
          sudo apt install -y ffmpeg
          find . -name "*.log.gz" -exec sh -c 'gunzip -c "$1" > "${1%.gz}" && ./ssl-go-tools/cmd/ssl-log-video/ssl-log-video -file "${1%.gz}" -output "${1%.gz}.avi" && ffmpeg -i "${1%.gz}.avi" -vcodec libx264 -acodec aac ${1%.gz}.mp4' _ {} \;

      - name: Upload video
        id: upload-video
        if: ${{ failure() || contains(github.event.pull_request.labels.*.name, 'シナリオテスト動画出力') }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.env.TEST}}-failure-log-video
          path: '*.mp4'

      - name: Upload log
        id: upload-log
        if: ${{ failure() || contains(github.event.pull_request.labels.*.name, 'シナリオテスト動画出力') }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.env.TEST}}-failure-log
          path: '*.log'

      - name: Comment PR with Artifact URL
        if: ${{ failure() }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Failure logs: ${{ steps.upload-video.outputs.artifact-url }}
