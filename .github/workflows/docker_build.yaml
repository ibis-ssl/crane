name: docker build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build Docker targets
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache@v4
        with:
          path: cache-mount
          key: docker-ccache-v2-${{ runner.os }}-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            docker-ccache-v2-${{ runner.os }}-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}-
            docker-ccache-v2-${{ runner.os }}-

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          cache-map: |
            {
              "crane-ccache": "/root/.ccache"
            }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: base
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:base
            ghcr.io/${{ github.repository }}:base-jazzy-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}
          cache-from: |
            type=gha,scope=base
            type=registry,ref=ghcr.io/${{ github.repository }}:base
          # mode=max は中間ステージのレイヤも全部キャッシュするため、リポジトリあたり
          # 10GB の Actions Cache をすぐ食い潰す（実測 10.55GB で上限超過し、
          # 「error writing layer blob: failed to reserve cache」でビルドが落ちた）。
          # ステージ間の再利用は上の type=registry,ref=... が担っているので min で足りる。
          cache-to: type=gha,mode=min,scope=base

      - name: Build dependency image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: deps
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:deps-jazzy
            ghcr.io/${{ github.repository }}:deps-jazzy-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}
          cache-from: |
            type=gha,scope=deps
            type=registry,ref=ghcr.io/${{ github.repository }}:deps-jazzy
            type=registry,ref=ghcr.io/${{ github.repository }}:base
          cache-to: type=gha,mode=min,scope=deps

      - name: Build scenario image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scenario
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:scenario-${{ github.sha }}
            ghcr.io/${{ github.repository }}:scenario-develop
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:deps-jazzy-${{ hashFiles('dependency_jazzy.repos', 'docker/Dockerfile') }}
            type=registry,ref=ghcr.io/${{ github.repository }}:scenario-develop
            type=gha,scope=scenario-develop
          cache-to: type=gha,mode=min,scope=scenario-develop
