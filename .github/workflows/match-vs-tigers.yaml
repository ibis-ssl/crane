name: TIGERs対戦CI

on:
  # develop へのマージ（PRマージによるマージコミットのpush）で対戦を実行する。
  # 以前は pull_request: types:[closed] をトリガーにしていたが、GitHub が
  # 2026-06-26 に導入した「low-trustトリガーのキャッシュ書き込み制限」により、
  # マージ後のイベント解決先がデフォルトブランチ(develop)になり buildx の
  # type=gha cache-to が書き込み権限を失って `failed to reserve cache` で
  # 失敗するようになった。push トリガーは許可リストに含まれるため書き込み可能。
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      crane_image_tag:
        description: '既存のcraneイメージタグ（例: match-abc1234）。指定しない場合は現在のコミットからビルド'
        required: false
        default: ''
      match_duration:
        description: '試合時間（分）。前半・後半に半分ずつ分割されます（デフォルト: 10分）'
        required: false
        default: '10'
  schedule:
    # 毎週月曜日 9:00 (JST) に実行
    - cron: '0 0 * * 1'

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read
  packages: write

jobs:
  build_crane_image:
    name: craneイメージのビルド
    # crane_image_tag指定時はスキップ
    if: inputs.crane_image_tag == ''
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [jazzy]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if reusable scenario image exists
        id: check_scenario_image
        run: |
          CANDIDATE_TAGS=()
          if [ -n "${{ github.sha }}" ]; then
            CANDIDATE_TAGS+=("scenario-${{ github.sha }}")
          fi
          # push イベントの github.sha は develop 上のマージコミット。
          # PRマージによるマージコミットなら第2親が scenario_test.yaml で
          # ビルド済みの PR head sha と一致するため、それも候補に加える。
          MERGE_PARENT2_SHA=$(git rev-parse HEAD^2 2>/dev/null || true)
          if [ -n "${MERGE_PARENT2_SHA}" ]; then
            CANDIDATE_TAGS+=("scenario-${MERGE_PARENT2_SHA}")
          fi

          FOUND_TAG=""
          for tag in "${CANDIDATE_TAGS[@]}"; do
            IMAGE="ghcr.io/${{ github.repository }}:${tag}"
            echo "Checking image: ${IMAGE}"
            if docker buildx imagetools inspect "${IMAGE}" > /dev/null 2>&1; then
              FOUND_TAG="${tag}"
              break
            fi
          done

          if [ -n "${FOUND_TAG}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "source_tag=${FOUND_TAG}" >> "$GITHUB_OUTPUT"
            echo "既存の scenario イメージが見つかりました: ${FOUND_TAG}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "既存の scenario イメージが見つかりません。新規ビルドを行います。"
          fi

      - name: Reuse scenario image as match image
        if: steps.check_scenario_image.outputs.exists == 'true'
        run: |
          SOURCE_IMAGE="ghcr.io/${{ github.repository }}:${{ steps.check_scenario_image.outputs.source_tag }}"
          TARGET_IMAGE="ghcr.io/${{ github.repository }}:match-${{ github.sha }}"
          docker buildx imagetools create --tag "${TARGET_IMAGE}" "${SOURCE_IMAGE}"
          echo "既存の ${SOURCE_IMAGE} を ${TARGET_IMAGE} としてタグ付けしました"

      - name: Free Disk Space
        if: steps.check_scenario_image.outputs.exists != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Build crane image
        if: steps.check_scenario_image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scenario
          push: true
          tags: ghcr.io/${{ github.repository }}:match-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:deps-jazzy
            type=registry,ref=ghcr.io/${{ github.repository }}:scenario-develop
            type=gha,scope=match-develop
            type=gha,scope=scenario-develop
            type=gha,scope=match
            type=gha,scope=scenario
          cache-to: type=gha,mode=min,scope=match-develop

  match_vs_tigers:
    needs: [build_crane_image]
    # ビルドが成功した場合、またはスキップされた場合（既存イメージ指定時）に実行
    if: always() && (needs.build_crane_image.result == 'success' || needs.build_crane_image.result == 'skipped')
    name: TIGERs Sumatra AIとの対戦
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine crane image tag
        run: |
          if [ -n "${{ inputs.crane_image_tag }}" ]; then
            echo "CRANE_TAG=${{ inputs.crane_image_tag }}" >> $GITHUB_ENV
            echo "使用するイメージ: ${{ inputs.crane_image_tag }} (既存イメージ)"
          else
            echo "CRANE_TAG=match-${{ github.sha }}" >> $GITHUB_ENV
            echo "使用するイメージ: match-${{ github.sha }} (新規ビルド)"
          fi

      - name: Calculate match duration settings
        run: |
          DURATION_MINUTES="${{ inputs.match_duration || 5 }}"
          HALF_MINUTES=$(( DURATION_MINUTES / 2 ))
          HALF_SECONDS=$(( (DURATION_MINUTES % 2) * 30 ))
          echo "HALF_DURATION=${HALF_MINUTES}m${HALF_SECONDS}s" >> $GITHUB_ENV
          echo "MATCH_MAX_DURATION=$(( DURATION_MINUTES * 60 * 14 / 10 ))" >> $GITHUB_ENV
          echo "試合時間: ${DURATION_MINUTES}分（前半/後半: ${HALF_MINUTES}m${HALF_SECONDS}s）"

      - name: Start Docker Compose services
        run: |
          mkdir -p docker/match-vs-tigers/ssl-logs
          chmod 777 docker/match-vs-tigers/ssl-logs
          mkdir -p docker/match-vs-tigers/crane-rosbag
          chmod 777 docker/match-vs-tigers/crane-rosbag
          docker compose -f docker/match-vs-tigers/docker-compose.yaml up -d
        env:
          CRANE_TAG: ${{ env.CRANE_TAG }}
          HALF_DURATION: ${{ env.HALF_DURATION }}
          MATCH_MAX_DURATION: ${{ env.MATCH_MAX_DURATION }}

      - name: Wait for match to complete
        timeout-minutes: 30
        run: |
          echo "試合の完了を待機中（最大 ${{ inputs.match_duration || 5 }} 分試合）..."
          # match-controllerコンテナが終了するまで待機
          while docker ps | grep -q match_controller; do
            sleep 5
          done
          echo "試合が完了しました"

      - name: Get match result
        id: result
        run: |
          # 結果ファイルを取得
          docker cp match_controller:/app/results/match_result.txt ./match_result.txt || echo "結果ファイルの取得に失敗"

          # 結果を表示
          if [ -f match_result.txt ]; then
            cat match_result.txt
            echo "RESULT_EXISTS=true" >> $GITHUB_ENV

            # GitHub Step Summaryに追加
            echo "## TIGERs対戦結果" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat match_result.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "結果ファイルが見つかりません"
            echo "RESULT_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Get service logs
        if: always()
        run: |
          echo "=== Docker Compose Logs ===" >> match_logs.txt
          docker compose -f docker/match-vs-tigers/docker-compose.yaml logs >> match_logs.txt 2>&1

      - name: Clean up Docker Compose services
        if: always()
        run: docker compose -f docker/match-vs-tigers/docker-compose.yaml down -v

      - name: Get SSL log file
        if: always()
        run: |
          echo "ssl-logsディレクトリの内容:"
          ls -la docker/match-vs-tigers/ssl-logs/ || echo "ディレクトリが見つかりません"
          # ssl-log-recorderコンテナが作成したファイルはpacker:root所有で600パーミッション
          # runnerユーザーが読めるように権限を変更
          sudo chmod -R a+r docker/match-vs-tigers/ssl-logs/ 2>/dev/null || true
          mkdir -p ssl-logs-artifact
          cp docker/match-vs-tigers/ssl-logs/* ssl-logs-artifact/ 2>/dev/null || echo "SSLログファイルが見つかりません"
          ls -la ssl-logs-artifact/ || true

      - name: Upload match result
        if: env.RESULT_EXISTS == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: match-result-${{ github.sha }}
          path: match_result.txt

      - name: Upload match logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: match-logs-${{ github.sha }}
          path: match_logs.txt

      - name: Upload SSL log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: match-ssl-log-${{ github.sha }}
          path: ssl-logs-artifact/
          if-no-files-found: warn

      - name: Get crane rosbag
        if: always()
        run: |
          echo "crane-rosbagディレクトリの内容:"
          ls -la docker/match-vs-tigers/crane-rosbag/ || echo "ディレクトリが見つかりません"
          sudo chmod -R a+r docker/match-vs-tigers/crane-rosbag/ 2>/dev/null || true
          mkdir -p crane-rosbag-artifact
          cp -r docker/match-vs-tigers/crane-rosbag/* crane-rosbag-artifact/ 2>/dev/null || echo "rosbagファイルが見つかりません"
          ls -la crane-rosbag-artifact/ || true

      - name: Upload crane rosbag
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: match-crane-rosbag-${{ github.sha }}
          path: crane-rosbag-artifact/
          if-no-files-found: warn

      - name: Show match result
        if: env.RESULT_EXISTS == 'true'
        run: |
          if grep -q "TIGERs WIN" match_result.txt; then
            echo "::notice::craneが敗北しました"
          elif grep -q "CRANE WIN" match_result.txt; then
            echo "::notice::craneが勝利しました！"
          else
            echo "::notice::引き分けでした"
          fi
