name: full build test

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  job:
    name: FullBuild
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [jazzy]
    steps:
      - name: Check disk space before cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Largest directories ==="
          du -h / 2>/dev/null | sort -rh | head -20 || true

      - name: free disk
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: false

      - name: Check disk space after cleanup
        run: df -h

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ROS 2 Jazzy
        run: |
          # ロケール設定
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US en_US.UTF-8
          export LANG=en_US.UTF-8

          # ROS 2リポジトリの追加
          sudo apt-get install -y software-properties-common curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

          # PowerShellのインストール（一部のパッケージで必要）
          sudo apt-get install -y wget apt-transport-https
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

          # ROS 2パッケージのインストール
          sudo apt-get update
          sudo apt-get install -y \
            ros-${{ matrix.rosdistro }}-desktop \
            ros-dev-tools \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pip

          # ament_packageをpipでインストール（APTに存在しないため）
          pip3 install --break-system-packages ament_package

          # rosdep初期化
          sudo rosdep init || true
        shell: bash

      - name: Clone dependency packages
        run: |
          mkdir -p dependency_ws
          vcs import dependency_ws < dependency_${{ matrix.rosdistro }}.repos
        shell: bash

      - name: Run rosdep install
        run: |
          rosdep update
          rosdep install -yqq --from-paths . dependency_ws --ignore-src --rosdistro ${{ matrix.rosdistro }}
        shell: bash

      - name: Build dependencies
        run: |
          source /opt/ros/${{ matrix.rosdistro }}/setup.bash
          colcon build --symlink-install \
            --base-paths dependency_ws \
            --parallel-workers 2 \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build crane packages
        run: |
          source /opt/ros/${{ matrix.rosdistro }}/setup.bash
          source install/setup.bash
          colcon build --symlink-install \
            --base-paths . \
            --parallel-workers 2 \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Test
        run: |
          source /opt/ros/${{ matrix.rosdistro }}/setup.bash
          source install/setup.bash
          colcon test --base-paths .
          colcon test-result --verbose
        shell: bash
