name: full build test

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  job:
    name: FullBuild
    runs-on: >-
      ${{
        (contains(github.event.pull_request.labels.*.name, 'SelfHostedRunner'))
          && fromJSON('[ "self-hosted"]')
          || fromJSON('[ "ubuntu-latest" ]')
      }}
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [jazzy]
    steps:
      - name: Check disk space before cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Largest directories ==="
          du -h / 2>/dev/null | sort -rh | head -20 || true

      - name: free disk
        uses: jlumbroso/free-disk-space@main
        with:
          # ホストで直接ビルドするため、すべてのクリーンアップを有効化
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: false

      - name: Check disk space after cleanup
        run: |
          echo "=== Disk space after cleanup ==="
          df -h

      - name: suppress warnings
        run: |
          git config --global --add safe.directory '*'

      - name: Set PR fetch depth
        run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.PR_FETCH_DEPTH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.rosdistro }}

      - name: Install additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget \
            ccache \
            python3-pip \
            ffmpeg \
            ca-certificates
        shell: bash

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'

      - name: Setup Problem Matchers for GCC
        run: echo "::add-matcher::.github/matchers/gcc.json"

      - name: Setup Problem Matchers for clang-format
        run: echo "::add-matcher::.github/matchers/clang-format.json"

      - name: Set git config
        uses: autowarefoundation/autoware-github-actions/set-git-config@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone dependency packages
        run: |
          mkdir -p dependency_ws
          vcs import dependency_ws < dependency_${{ matrix.rosdistro }}.repos
        shell: bash

      - name: Run rosdep install
        run: |
          sudo apt-get -yqq update
          rosdep update
          DEBIAN_FRONTEND=noninteractive rosdep install -yqq --from-paths . dependency_ws --ignore-src --rosdistro ${{ matrix.rosdistro }}
        shell: bash

      - name: Build
        run: |
          . /opt/ros/${{ matrix.rosdistro }}/setup.sh
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Test
        id: test
        uses: autowarefoundation/autoware-github-actions/colcon-test@v1
        with:
          rosdistro: ${{ matrix.rosdistro }}
          build-depends-repos: dependency_${{ matrix.rosdistro }}.repos
