name: build test

on:
  workflow_dispatch:
  pull_request:
  merge_group:

jobs:
  job:
    name: BuildAndRun
    runs-on: >-
      ${{
        (contains(github.event.pull_request.labels.*.name, 'SelfHostedRunner'))
          && fromJSON('[ "self-hosted"]')
          || fromJSON('[ "ubuntu-latest" ]')
      }}
    timeout-minutes: 30
    container: ros:${{ matrix.rosdistro }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # ccache configuration
      PATH: /usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: /usr/lib/ccache/gcc
      CXX: /usr/lib/ccache/g++
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 10G
      USE_CCACHE: 1
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [jazzy]
    steps:
      - name: suppress warnings
        run: |
          git config --global --add safe.directory '*'

      - name: Set PR fetch depth
        run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.PR_FETCH_DEPTH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Problem Matchers for GCC
        run: echo "::add-matcher::.github/matchers/gcc.json"

      - name: Setup Problem Matchers for clang-format
        run: echo "::add-matcher::.github/matchers/clang-format.json"

      - name: Set git config
        uses: autowarefoundation/autoware-github-actions/set-git-config@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wget
        run: |
          sudo apt-get update
          sudo apt-get install -y wget libcpprest-dev

      - name: Clone dependency packages
        run: |
          mkdir -p dependency_ws
          vcs import dependency_ws < dependency_${{ matrix.rosdistro }}.repos
        shell: bash

      - name: Generate rosdep keys file
        run: |
          sudo rosdep init || true
          rosdep update
          colcon list -p --base-paths . dependency_ws > packages.txt
          rosdep keys --from-paths $(cat packages.txt) --rosdistro ${{ matrix.rosdistro }} > rosdep_keys.txt
        shell: bash

      - name: Cache dependency_ws
        uses: actions/cache@v4
        with:
          path: dependency_ws
          key: dependency_ws-${{ matrix.rosdistro }}-${{ hashFiles('dependency_${{ matrix.rosdistro }}.repos') }}
          restore-keys: |
            dependency_ws-${{ matrix.rosdistro }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.rosdistro }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.rosdistro }}-${{ runner.os }}-

      - name: Cache rosdep
        id: cache-rosdep
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists
            /root/.ros/rosdep
          key: rosdep-${{ matrix.rosdistro }}-${{ runner.os }}-${{ hashFiles('rosdep_keys.txt') }}
          restore-keys: |
            rosdep-${{ matrix.rosdistro }}-${{ runner.os }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ./build
            ./install
          key: build-${{ matrix.rosdistro }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/package.xml') }}
          restore-keys: |
            build-${{ matrix.rosdistro }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Run rosdep install
        run: |
          sudo apt-get -yqq update
          if [[ "${{ steps.cache-rosdep.outputs.cache-hit }}" == "true" ]]; then
            echo "Rosdep cache hit. Skipping rosdep update and install."
          else
            echo "Rosdep cache miss. Running rosdep update and install."
            rosdep update
            DEBIAN_FRONTEND=noninteractive rosdep install -yqq --from-paths . dependency_ws --ignore-src --rosdistro ${{ matrix.rosdistro }}
          fi
        shell: bash

      - name: Cache rosdep
        id: cache-rosdep
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists
            /home/runner/.ros/rosdep
          key: rosdep-${{ matrix.rosdistro }}-${{ runner.os }}-${{ hashFiles('rosdep_keys.txt') }}
          restore-keys: |
            rosdep-${{ matrix.rosdistro }}-${{ runner.os }}-

      - name: Build
        run: |
          . /opt/ros/${{ matrix.rosdistro }}/setup.sh
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ./build
            ./install
          key: build-${{ matrix.rosdistro }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/package.xml') }}
          restore-keys: |
            build-${{ matrix.rosdistro }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        run: |
          . /opt/ros/${{ matrix.rosdistro }}/setup.sh
          colcon test --event-handlers console_cohesion+
        shell: bash
