# SSL Commentary System Configuration

commentary_node:
  ros__parameters:
    # Gemini API settings
    gemini_api_key: ""  # Set via environment variable GEMINI_API_KEY
    gemini_model: "gemini-2.0-flash-exp"

    # Audio settings
    audio_sample_rate: 24000
    audio_device: ""  # Empty for default device

    # Statler settings
    writer_update_rate: 1.0  # Hz
    analyst_silence_threshold: 5.0  # Seconds before switching to analyst mode
